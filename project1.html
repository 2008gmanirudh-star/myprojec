<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>To-Do List</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color:whitesmoke;
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
  }
  h2 {
    text-align: center;
    color: #333;
  }
  #new-task {
    display: flex;
    margin-bottom: 20px;
  }
  #new-task input[type="text"] {
    flex-grow: 1;
    padding: 10px;
    font-size: 16px;
  }
  #new-task button {
    padding: 10px 15px;
    background-color: green;
    border: none;
    color: black;
    font-size: 16px;
    cursor: pointer;
  }
  #new-task button:hover {
    background-color: white;
  }
  ul#task-list {
    list-style: none;
    padding-left: 0;
  }
  ul#task-list li {
    background: yellowgreen;
    margin-bottom: 10px;
    padding: 12px;
    font-size: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 4px;
    box-shadow: 0 2px 4px black;
  }
  ul#task-list li.completed {
    text-decoration: line-through;
    color: #0882ed;
  }
  ul#task-list button.delete-btn {
    background-color: red;
    border: none;
    color: white;
    padding: 6px 12px;
    font-size: 14px;
    border-radius: 3px;
    cursor: pointer;
  }
  ul#task-list button.delete-btn:hover {
    background-color: red;
  }
</style>
</head>
<body>
  <h2>To-Do List</h2>
  <div id="new-task">
    <input type="text" id="task-input" placeholder="Enter new task..." />
    <button id="add-btn">Add</button>
  </div>
  <ul id="task-list"></ul>

<script>
  const taskInput = document.getElementById('task-input');
  const addBtn = document.getElementById('add-btn');
  const taskList = document.getElementById('task-list');

  // Add new task to the list
  function addTask() {
    const taskText = taskInput.value.trim();
    if (taskText === "") {
      alert("Please enter a task.");
      return;
    }
    const li = document.createElement('li');
    li.textContent = taskText;

    // Toggle completion on click
    li.addEventListener('click', () => {
      li.classList.toggle('completed');
    });

    // Create delete button
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = "Delete";
    deleteBtn.className = "delete-btn";
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();  // Prevent toggling complete on delete
      taskList.removeChild(li);
    });

    li.appendChild(deleteBtn);
    taskList.appendChild(li);
    taskInput.value = "";
    taskInput.focus();
  }
  
</script>
</body>
</html>
