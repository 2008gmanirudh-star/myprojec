<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap Position and Shadows</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .custom-box {
      width: 200px;
      height: 150px;
      background-color: #f8f9fa;
      border: 1px solid #ddd;
      padding: 1rem;
    }
  </style>
</head>
<body>

<div class="container my-5">

  <h3>Position Examples</h3>
  <div class="position-relative custom-box shadow">
    Parent Box (position-relative)
    <div class="position-absolute top-0 start-0 bg-primary text-white p-2 shadow-sm" style="width: 100px;">
      Top Start (0,0)
    </div>
    <div class="position-absolute top-50 start-50 translate-middle bg-success text-white p-2 shadow-sm" style="width: 100px;">
      Centered (translate-middle)
    </div>
    <div class="position-absolute bottom-0 end-0 bg-danger text-white p-2 shadow-sm" style="width: 100px;">
      Bottom End (0,0)
    </div>
  </div>

  <hr />

  <h3>Shadow Examples</h3>
  <div class="mb-3 p-3 bg-white shadow-none rounded">
    No Shadow (shadow-none)
  </div>
  <div class="mb-3 p-3 bg-white shadow-sm rounded">
    Small Shadow (shadow-sm)
  </div>
  <div class="mb-3 p-3 bg-white shadow rounded">
    Regular Shadow (shadow)
  </div>
  <div class="mb-3 p-3 bg-white shadow-lg rounded">
    Large Shadow (shadow-lg)
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
